version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: igniten_postgres
    environment:
      POSTGRES_DB: igniten_core
      POSTGRES_USER: igniten_user
      POSTGRES_PASSWORD: igniten_password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U igniten_user -d igniten_core"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
